name: Plugin quality checks

on:
  push:
    branches:
      - "perf/lazy-user-font-loading-20261016"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build release bundle
        run: npm run build
      - name: Assemble test install package
        run: |
          mkdir -p chinese-writing-layout
          cp main.js manifest.json styles.css chinese-writing-layout/
      - name: Upload installable test bundle
        uses: actions/upload-artifact@v4
        with:
          name: chinese-writing-layout-test-build
          path: chinese-writing-layout/
          retention-days: 14
