name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          node -e "const versions=require('./versions.json'); if (!versions[process.argv[1]]) process.exit(1)" "$VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$LOCK_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_DIR="chinese-writing-layout"
          mkdir -p "$PACKAGE_DIR"
          cp main.js manifest.json styles.css "$PACKAGE_DIR/"
          zip -r "chinese-writing-layout-$VERSION.zip" "$PACKAGE_DIR"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi
          gh release create "$VERSION" main.js manifest.json styles.css "chinese-writing-layout-$VERSION.zip" --target "$GITHUB_SHA" --generate-notes --title "$VERSION"
